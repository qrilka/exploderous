name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable repository hooks
        run: git config --local core.hooksPath .githooks
      - name: Install pinned quality-check tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        timeout-minutes: 15
        with:
          tool: |
            just@1.51.0
            cargo-machete@0.9.2
            ast-grep@0.51.0
          fallback: cargo-binstall
      - name: Complete standard quality check (no mutation scan)
        run: just check
